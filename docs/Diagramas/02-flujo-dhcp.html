<text x="50" y="58" class="t-title">DHCP con reserva y DHCP snooping</text>
<text x="50" y="88" class="t-sub">Cómo ZBX-0813 recibe 10.20.25.10 y por qué un servidor DHCP falso no puede responder</text>
<use href="#srv" x="230" y="170"/>
<text x="230" y="252" text-anchor="middle" class="t-name">ZBX-0813</text>
